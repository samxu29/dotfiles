filetype: kdl

detect:
    filename: "\\.kdl$"

rules:
    - comment:
        start: "//"
        end: "$"
    - comment:
        start: "/\\*"
        end: "\\*/"
    - constant.bool: "\\b(true|false|null)\\b"
    - constant.number: "\\b[0-9]+(\\.[0-9]+)?\\b"
    - constant.string:
        start: "\""
        end: "\""
        skip: "\\\\."
    - type: "\\(([^)]+)\\)"
    - statement: "\\b([a-zA-Z_][a-zA-Z0-9_.-]*)\\b"
