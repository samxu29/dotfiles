# Default tiling and window sizing settings.
# Documentation: https://docs.noctalia.dev/umbriel/layout/

[layout]
mode = "scrolling"
gap = 2
width_presets = [0.333, 0.5, 0.667]

[layout.struts]
left = 1
right = 1
top = 2
bottom = 1

[layout.scrolling]
default_width_fraction = 0.5
center_underfull_strip = true
center_focused = "never"

[layout.dwindle]
new_exits_fullscreen = false

[layout.master]
position = "left"
default_width_fraction = 0.55
new_on_top = true
new_becomes_master = false
new_exits_fullscreen = false
